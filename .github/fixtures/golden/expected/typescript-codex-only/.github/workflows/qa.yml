name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Language and toolchain setup. Substituted by /init-project from the
      # chosen language profile's ci_setup_steps: the right `uses: ...` /
      # `run: ...` steps for this project's toolchain.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install deps
        run: npm ci

      - name: Run quality gate (lint, format, types, unit + functional)
        run: npm run qa

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Same language/toolchain setup as the qa job.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install deps
        run: npm ci

      # no browser needed for this project's e2e suite

      - name: Run end-to-end suite
        run: npm run e2e

  # Feature-list check (AGENTS.md <hard-rules>): schema + every done feature
  # cites an existing test file. Agent-neutral plain script.
  features-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate the feature list
        run: python3 scripts/features_check.py
